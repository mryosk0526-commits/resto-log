<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>食べ歩きメモ（公開）</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .view-header { padding: 16px; text-align: center; border-bottom: 1px solid #eee; background:#fff; }
    .view-title { font-size: 20px; font-weight: 800; }
    .view-sub { font-size: 12px; color: #888; margin-top: 4px; }
    .vcard { background: #fff; border-bottom: 1px solid #eee; padding: 14px 16px; }
    .vcard h3 { font-size: 16px; margin: 0 0 6px; }
    .vmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
    .vmemo { font-size: 13px; color: #555; margin: 6px 0 0; white-space: pre-wrap; }
    .vphotos { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .vphotos img { height: 110px; border-radius: 8px; flex: 0 0 auto; object-fit: cover; background:#f0f0f0; }
    .msg { padding: 44px 20px; text-align: center; color: #888; }
    .view-foot { padding: 20px; text-align: center; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="view-header">
    <div class="view-title">🍜 食べ歩きメモ</div>
    <div class="view-sub" id="vsub">公開ページ</div>
  </div>
  <main id="app"><p class="msg">読み込み中…</p></main>
  <div class="view-foot">閲覧専用ページ</div>

  <script src="vendor/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="view.js"></script>
</body>
</html>
