<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>コレログ（公開）</title>
  <script>try{var t=localStorage.getItem('resto-log-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .view-header { padding: 16px; text-align: center; border-bottom: 1px solid var(--line); background: var(--surface); }
    .view-title { font-size: 20px; font-weight: 800; }
    .view-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .view-tools { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
    .msg { padding: 44px 20px; text-align: center; color: var(--muted); }
    .view-foot { padding: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="view-header">
    <div class="view-title">🍜 コレログ</div>
    <div class="view-sub" id="vsub">公開ページ</div>
  </div>
  <div class="view-tools" id="viewTools" hidden>
    <div class="viewbar">
      <div class="viewmodes" id="viewModes" role="group" aria-label="表示切替">
        <button class="vm" data-mode="list">☰ リスト</button>
        <button class="vm" data-mode="card">▦ カード</button>
        <button class="vm" data-mode="gallery">▧ ギャラリー</button>
      </div>
    </div>
  </div>
  <main id="app"><p class="msg">読み込み中…</p></main>
  <div class="view-foot">閲覧専用ページ</div>

  <!-- 写真の拡大表示 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="閉じる">✕</button>
    <button class="lightbox-nav prev" id="lightboxPrev" aria-label="前の写真" hidden>‹</button>
    <button class="lightbox-nav next" id="lightboxNext" aria-label="次の写真" hidden>›</button>
    <span class="lightbox-count" id="lightboxCount"></span>
    <img id="lightboxImg" alt="" draggable="false" />
    <p class="lightbox-hint">◀▶・スワイプ・矢印で送る／背景タップで閉じる</p>
  </div>

  <script src="vendor/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="view.js"></script>
</body>
</html>
