<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>食べ歩きメモ</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="食べ歩きメモ" />

  <script>try{var t=localStorage.getItem('resto-log-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== ヘッダー ===== -->
  <header class="app-header">
    <h1 class="app-title">🍜 食べ歩きメモ</h1>
    <div class="header-actions">
      <button id="calendarBtn" class="icon-btn" aria-label="カレンダー">📅</button>
      <button id="conquestBtn" class="icon-btn" aria-label="全国制覇">🗾</button>
      <button id="menuBtn" class="icon-btn" aria-label="メニュー">⋯</button>
    </div>
  </header>

  <!-- ===== フィルタバー ===== -->
  <div class="filterbar">
    <input type="search" id="searchInput" class="search-input" placeholder="店名・メモで検索" aria-label="店名・メモで検索" />
    <div class="tabs" id="statusTabs">
      <button class="tab is-active" data-status="all">すべて</button>
      <button class="tab" data-status="want">行きたい</button>
      <button class="tab" data-status="visited">行った</button>
    </div>
    <div class="filter-selects">
      <select id="prefFilter" class="mini-select" aria-label="都道府県で絞る">
        <option value="">全国</option>
      </select>
      <select id="genreFilter" class="mini-select" aria-label="ジャンルで絞る">
        <option value="">全ジャンル</option>
      </select>
      <select id="sortSelect" class="mini-select" aria-label="並び替え">
        <option value="reg">登録順</option>
        <option value="date_desc">日付が新しい順</option>
        <option value="date_asc">日付が古い順</option>
        <option value="rating">評価が高い順</option>
        <option value="pref">都道府県順</option>
        <option value="genre">ジャンル順</option>
      </select>
    </div>
    <div class="viewbar">
      <div class="viewmodes" id="viewModes" role="group" aria-label="表示切替">
        <button class="vm" data-mode="list">☰ リスト</button>
        <button class="vm" data-mode="card">▦ カード</button>
        <button class="vm" data-mode="gallery">▧ ギャラリー</button>
      </div>
    </div>
  </div>

  <!-- ===== 絞り込み中バー（地方など） ===== -->
  <div class="active-filter" id="activeFilterBar" hidden>
    <span id="activeFilterLabel"></span>
    <button id="activeFilterClear">解除</button>
  </div>

  <!-- ===== リスト ===== -->
  <main class="list" id="list"></main>
  <div id="listSentinel" aria-hidden="true"></div>

  <!-- ===== 空状態 ===== -->
  <div class="empty" id="emptyState" hidden>
    <div class="empty-emoji">🍽️</div>
    <p class="empty-text">まだ店がありません</p>
    <p class="empty-sub">右下の ＋ から、行きたい店を追加してみよう</p>
  </div>

  <!-- ===== 追加ボタン ===== -->
  <button id="fab" class="fab" aria-label="店を追加">＋</button>

  <!-- ===== 追加/編集モーダル ===== -->
  <div class="modal" id="editModal" hidden>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 id="editTitle">店を追加</h2>
        <button class="icon-btn" data-close aria-label="閉じる">✕</button>
      </div>
      <form id="editForm" class="form">
        <input type="hidden" id="f_id" />
        <label class="field">
          <span class="label">店名 <em>*</em></span>
          <input type="text" id="f_name" required placeholder="例）餃子の王将 三宮店" />
        </label>
        <label class="field">
          <span class="label">都道府県</span>
          <select id="f_pref"></select>
        </label>
        <label class="field">
          <span class="label">ジャンル</span>
          <select id="f_genre"></select>
        </label>
        <label class="field">
          <span class="label">URL（食べログ等）</span>
          <input type="url" id="f_url" inputmode="url" placeholder="https://..." />
        </label>
        <label class="field">
          <span class="label">メモ</span>
          <textarea id="f_memo" rows="2" placeholder="気になる一品・営業時間・同行者など"></textarea>
        </label>
        <fieldset class="field seg">
          <span class="label">状態</span>
          <div class="segmented">
            <label><input type="radio" name="f_status" value="want" checked /><span>行きたい</span></label>
            <label><input type="radio" name="f_status" value="visited" /><span>行った</span></label>
          </div>
        </fieldset>
        <label class="field">
          <span class="label">日付 <small id="f_dateNote"></small></span>
          <input type="date" id="f_date" />
        </label>
        <fieldset class="field" id="ratingField">
          <span class="label">評価 <small id="f_ratingNote"></small></span>
          <div class="rating-input" id="f_rating"></div>
        </fieldset>
        <fieldset class="field" id="photoField">
          <span class="label">写真 <small id="f_photocount"></small></span>
          <div class="photo-grid" id="f_photoGrid"></div>
          <label class="btn small photo-add">
            <span id="f_photoAddLabel">＋ 写真を追加</span>
            <input type="file" id="f_photoInput" accept="image/*" multiple hidden />
          </label>
          <p class="hint">撮影／ライブラリから選択。自動で軽く圧縮して保存（最大10枚）</p>
        </fieldset>
        <div class="form-actions">
          <button type="button" class="btn ghost danger" id="deleteBtn" hidden>削除</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== 詳細モーダル ===== -->
  <div class="modal" id="detailModal" hidden>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 id="d_name">店名</h2>
        <button class="icon-btn" data-close aria-label="閉じる">✕</button>
      </div>
      <div class="detail-body">
        <div class="detail-meta">
          <span class="badge" id="d_status"></span>
          <span class="chip" id="d_genre" hidden></span>
          <span class="chip" id="d_pref"></span>
          <span class="chip" id="d_count" hidden></span>
        </div>

        <!-- 訪問（複数回）リスト -->
        <div class="visits" id="d_visits"></div>

        <button class="btn ghost add-visit-btn" id="addVisitBtn">＋ もう1回来た（訪問を追加）</button>

        <div class="publish-row" id="d_publishRow" hidden>
          <span><b>🌐 このお店を公開する</b><small>共有リンクで他の人が見られます（読むだけ）</small></span>
          <label class="switch"><input type="checkbox" id="d_public" /><span class="slider"></span></label>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== メニュー（エクスポート/インポート） ===== -->
  <div class="modal" id="menuModal" hidden>
    <div class="modal-sheet compact">
      <div class="modal-head">
        <h2>データ管理</h2>
        <button class="icon-btn" data-close aria-label="閉じる">✕</button>
      </div>
      <div class="menu-list">
        <div id="syncPanel" class="sync-panel"></div>
        <button class="menu-item" id="exportBtn">
          <span class="menu-emoji">📤</span>
          <span><b>バックアップを書き出す</b><small>機種変・データ消え対策（必ず定期的に）</small></span>
        </button>
        <label class="menu-item">
          <span class="menu-emoji">📥</span>
          <span><b>バックアップを読み込む</b><small>書き出したファイルから復元</small></span>
          <input type="file" id="importInput" accept="application/json,.json" hidden />
        </label>
        <div class="menu-item toggle-row">
          <span class="menu-emoji">🗾</span>
          <span><b>全国制覇モード</b><small>ヘッダーの🗾ボタンを表示する</small></span>
          <label class="switch"><input type="checkbox" id="conquestToggle" /><span class="slider"></span></label>
        </div>
        <div class="menu-item toggle-row">
          <span class="menu-emoji">🌙</span>
          <span><b>ダークモード</b><small>暗い配色に切り替え</small></span>
          <label class="switch"><input type="checkbox" id="darkToggle" /><span class="slider"></span></label>
        </div>
        <div class="menu-stat" id="menuStat"></div>
      </div>
    </div>
  </div>

  <!-- ===== 全国制覇 ===== -->
  <div class="modal" id="conquestModal" hidden>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>🗾 全国制覇</h2>
        <button class="icon-btn" data-close aria-label="閉じる">✕</button>
      </div>
      <div class="conquest-body">
        <div class="cq-headline"><span id="cq_count">0</span> / 47 制覇 <small id="cq_pct"></small></div>
        <div class="cq-bar"><div class="cq-bar-fill" id="cq_barfill"></div></div>
        <div class="cq-legend">
          <span><i class="lg visited"></i>制覇</span>
          <span><i class="lg want"></i>狙い中</span>
          <span><i class="lg none"></i>未開拓</span>
        </div>
        <div class="cq-map-wrap"><svg id="cq_map" viewBox="0 0 420 360" class="cq-map" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <p class="hint" style="text-align:center">県をタップするとその県の一覧に飛びます</p>
        <div class="cq-regions" id="cq_regions"></div>
      </div>
    </div>
  </div>

  <!-- ===== カレンダー ===== -->
  <div class="modal" id="calendarModal" hidden>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>📅 カレンダー</h2>
        <button class="icon-btn" data-close aria-label="閉じる">✕</button>
      </div>
      <div class="cal-body">
        <div class="cal-seg-wrap">
          <div class="cal-seg" id="cal_seg" role="group" aria-label="月/年切替">
            <button data-cmode="month" class="is-active">月</button>
            <button data-cmode="year">年</button>
          </div>
        </div>
        <div class="cal-nav">
          <button id="cal_prev" aria-label="前へ">‹</button>
          <div class="cal-title-wrap">
            <div class="cal-title" id="cal_title"></div>
            <div class="cal-monthcount" id="cal_monthcount"></div>
          </div>
          <button id="cal_next" aria-label="次へ">›</button>
        </div>
        <div class="cal-grid" id="cal_grid"></div>
        <div class="cal-year" id="cal_year" hidden></div>
        <div class="cal-day" id="cal_day"></div>
      </div>
    </div>
  </div>

  <!-- ===== 写真の拡大表示（ピンチ/パン） ===== -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="閉じる">✕</button>
    <button class="lightbox-nav prev" id="lightboxPrev" aria-label="前の写真" hidden>‹</button>
    <button class="lightbox-nav next" id="lightboxNext" aria-label="次の写真" hidden>›</button>
    <span class="lightbox-count" id="lightboxCount"></span>
    <img id="lightboxImg" alt="" draggable="false" />
    <p class="lightbox-hint">◀▶・スワイプ・矢印キーで送る／ピンチで拡大／空いた所をタップで閉じる</p>
  </div>

  <!-- ===== トースト ===== -->
  <div class="toast" id="toast" hidden></div>

  <script src="vendor/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
