# Supabase 無料枠のポーズ（7日間無リクエストで一時停止）を防ぐキープアライブ。
# 毎日1回、REST API に軽い select を投げてプロジェクトを「活動中」に保つ。
# ・anon key は公開前提の鍵（RLSでデータは守られる）なので、そのまま置いてOK＝secret不要。
#
# ＋【60日対策】GitHub は「リポジトリに60日間コミットが無い」と定期ワークフローを自動無効化する。
#   そうなると ping も止まり→Supabaseがポーズする連鎖が起きる。
#   これを防ぐため、毎月 1日・15日に “ハートビート” の空タイムスタンプを自分でコミット＆pushして、
#   リポジトリを常に「活動中（<60日）」に保つ。人の操作は一切不要で回り続ける。
name: keepalive

on:
  schedule:
    # 毎日 03:17 UTC（＝日本時間 12:17 ごろ）。分をずらすのは GitHub の混雑回避のため。
    - cron: "17 3 * * *"
  workflow_dispatch: {} # 手動でも走らせられる（動作確認用）

# ハートビートのコミットを push するために書き込み権限を付与
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase REST
        run: |
          SUPABASE_URL="https://tnjdxdipupjuriticzxj.supabase.co"
          ANON_KEY="sb_publishable_Fboa8JZFKtKvfenLA9qKUg_rIL8LcEX"  # 公開anon key（RLSで保護）
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "HTTP $code"
          # 200/206 なら成功（空配列でもOK）。それ以外は失敗として通知したいので非0で落とす。
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "Unexpected status: $code"
            exit 1
          fi

      - name: Heartbeat commit (60日自動無効化の防止・月2回だけ)
        run: |
          # 毎月 1日 と 15日 だけコミットする（最大でも約16日間隔＝60日にはるか余裕・履歴も汚しすぎない）。
          day=$(date -u +%d)
          if [ "$day" != "01" ] && [ "$day" != "15" ]; then
            echo "heartbeat: 今日はコミット日ではない（1日/15日のみ）。スキップ。"
            exit 0
          fi
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-run.txt
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last-run.txt
          # 差分が無ければ何もしない（安全）。[skip ci] で余計なビルドは走らせない。
          git commit -m "chore(keepalive): heartbeat to keep the scheduled workflow alive [skip ci]" || {
            echo "nothing to commit"; exit 0;
          }
          git push
