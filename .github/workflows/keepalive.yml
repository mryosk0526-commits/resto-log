# Supabase 無料枠のポーズ（7日間無リクエストで一時停止）を防ぐキープアライブ。
# 毎日1回、REST API に軽い select を投げてプロジェクトを「活動中」に保つだけ。
# ・anon key は公開前提の鍵（RLSでデータは守られる）なので、そのまま置いてOK＝secret不要。
# ・データは一切読めない（RLSで anon には 0 行）が、DB へのリクエスト自体がポーズ回避になる。
name: keepalive

on:
  schedule:
    # 毎日 03:17 UTC（＝日本時間 12:17 ごろ）。分をずらすのは GitHub の混雑回避のため。
    - cron: "17 3 * * *"
  workflow_dispatch: {} # 手動でも走らせられる（動作確認用）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          SUPABASE_URL="https://tnjdxdipupjuriticzxj.supabase.co"
          ANON_KEY="sb_publishable_Fboa8JZFKtKvfenLA9qKUg_rIL8LcEX"  # 公開anon key（RLSで保護）
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "HTTP $code"
          # 200/206 なら成功（空配列でもOK）。それ以外は失敗として通知したいので非0で落とす。
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "Unexpected status: $code"
            exit 1
          fi
